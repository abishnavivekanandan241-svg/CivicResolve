<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#475569"/>
  <!-- Overflowing green dumpster -->
  <rect x="180" y="160" width="240" height="180" rx="10" fill="#15803d"/>
  <rect x="160" y="140" width="280" height="25" rx="5" fill="#166534"/>
  <!-- Trash piles spilling out -->
  <circle cx="170" cy="310" r="45" fill="#64748b"/>
  <circle cx="210" cy="330" r="50" fill="#ca8a04"/>
  <circle cx="390" cy="320" r="48" fill="#dc2626"/>
  <circle cx="430" cy="335" r="40" fill="#3b82f6"/>
  <circle cx="270" cy="130" r="35" fill="#f59e0b"/>
  <circle cx="330" cy="120" r="38" fill="#e11d48"/>
  <rect x="20" y="20" width="250" height="40" rx="8" fill="#ef4444" opacity="0.9"/>
  <text x="30" y="46" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">GARBAGE OVERFLOW</text>
  <text x="30" y="380" font-family="sans-serif" font-size="14" fill="#cbd5e1">Brough Road Market area, Ward 1, Erode</text>
</svg>

