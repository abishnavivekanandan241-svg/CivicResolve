  <line x1="180" y1="220" x2="180" y2="300" stroke="#64748b" stroke-width="8"/>
  <line x1="220" y1="220" x2="220" y2="300" stroke="#64748b" stroke-width="8"/>
  <line x1="260" y1="220" x2="260" y2="300" stroke="#64748b" stroke-width="8"/>
  <line x1="300" y1="220" x2="300" y2="300" stroke="#64748b" stroke-width="8"/>
  <line x1="340" y1="220" x2="340" y2="300" stroke="#64748b" stroke-width="8"/>
  <line x1="380" y1="220" x2="380" y2="300" stroke="#64748b" stroke-width="8"/>
  <line x1="420" y1="220" x2="420" y2="300" stroke="#64748b" stroke-width="8"/>
